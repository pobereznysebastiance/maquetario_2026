<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'"><title>Maquetario</title><link rel="stylesheet" href="ui/index.css"></head>
<body>
<header class="topbar"><div id="topbarRoot" class="topbar-root"></div></header>
<main class="app-layout">
 <aside class="leftpanel"><nav id="tools" class="tools"></nav><div class="pages-heading"><div class="rail-switch"></div><button class="icon-btn" id="addPage" title="Agregar página" aria-label="Agregar página"><span data-icon="plus"></span></button></div><div id="thumbnails" class="thumbnails" role="tabpanel" aria-labelledby="railTab-pages"></div><div id="railView" class="rail-view" role="tabpanel" hidden></div><div class="left-bottom"><span class="version"></span></div></aside>
 <section class="center"><div class="documentbar"><div id="documentbarRoot" class="documentbar-root"></div></div><div class="workarea" id="workarea"><div class="ruler-x" id="rulerX"></div><div class="ruler-y" id="rulerY"></div><div id="spreadStage"><div id="spread" class="spread"></div></div><div class="canvas-hint" id="canvasHint"><kbd>V</kbd> Seleccionar <span>·</span> Doble clic para editar texto <span>·</span> Arrastrá la esquina para redimensionar</div></div><footer class="template-panel"><div class="template-heading"></div><div class="templates" id="templates"></div></footer><div class="statusbar"></div></section>
 <aside class="inspector"><div class="tabs" role="tablist" aria-label="Inspector"><button type="button" class="tab active" id="inspectorTab-book" data-tab="book" role="tab" aria-selected="true" aria-controls="inspectorContent">Libro</button><button type="button" class="tab" id="inspectorTab-page" data-tab="page" role="tab" aria-selected="false" aria-controls="inspectorContent" tabindex="-1">Página</button><button type="button" class="tab" id="inspectorTab-selection" data-tab="selection" role="tab" aria-selected="false" aria-controls="inspectorContent" tabindex="-1">Selección</button></div><div id="inspectorContent" class="inspector-content" role="tabpanel" aria-labelledby="inspectorTab-book"></div><div class="inspector-foot"><span data-icon="info"></span><span id="inspectorTip">La grilla es una guía: no se imprime ni aparece en el PDF.</span><button type="button" class="icon-btn inspector-tip-close" id="inspectorTipClose" title="Ocultar consejo" aria-label="Ocultar consejo"><span data-icon="close"></span></button></div></aside>
</main>
<input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden><input type="file" id="openInput" accept=".mqt,.maquetario,.librostudio,.json" hidden><div class="language-source" hidden><select id="language" aria-label="Idioma" title="Idioma de la interfaz"><option value="es">ES · Español</option><option value="en">EN · English</option><option value="pt">PT · Português</option></select></div><div id="toast" role="status"></div><div id="printRoot"></div>
<script src="pdf-lib.min.js"></script><script src="sample-image.js"></script><script src="hyphenation/hyphen.js"></script><script src="hyphenation/patterns/es.js"></script><script src="hyphenation/patterns/en-us.js"></script><script src="hyphenation/patterns/pt.js"></script><script src="build/core.js"></script><script src="build/app.js"></script><script src="test-loader.js"></script></body></html>
