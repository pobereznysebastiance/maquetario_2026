<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.maquetario.local; connect-src 'none'"><title>Maquetario</title><link rel="stylesheet" href="ui/index.css"></head>
<body>
<header class="topbar">
 <div class="brand"><img class="brandmark" src="maquetario.svg" alt="Símbolo de Maquetario"><div><strong>Maquetario</strong><small>Maquetación y Diseño de Libros</small></div></div>
 <div class="toolbar" id="fileActions"></div><div class="topright"><button id="preview" class="btn"><span data-icon="eye"></span>Vista previa</button><button id="export" class="btn primary"><span data-icon="export"></span>Exportar PDF</button></div>
</header>
<main class="app-layout">
 <aside class="leftpanel"><nav id="tools" class="tools"></nav><div class="pages-heading"><span>Páginas</span><button class="icon-btn" id="addPage" title="Agregar página" aria-label="Agregar página"><span data-icon="plus"></span></button></div><div id="thumbnails" class="thumbnails"></div><div class="left-bottom"><span class="version">v3.0</span></div></aside>
 <section class="center"><div class="documentbar"><div><span class="document-dot"></span><span id="documentName">La caída</span><span class="doc-format" id="documentFormat">A5 · 148 × 210 mm</span></div><button class="quiet" id="documentSettings"><span data-icon="settings"></span> Configurar libro</button></div><div class="workarea" id="workarea"><div class="ruler-x" id="rulerX"></div><div class="ruler-y" id="rulerY"></div><div id="spreadStage"><div id="spread" class="spread"></div></div><div class="canvas-hint" id="canvasHint"><kbd>V</kbd> Seleccionar <span>·</span> Doble clic para editar texto <span>·</span> Arrastrá la esquina para redimensionar</div></div><footer class="template-panel"><div class="template-heading"><span>Plantillas <span class="chevron">⌄</span></span><div class="zoom"><button id="zoomOut" class="icon-btn" aria-label="Alejar">−</button><input type="range" min="40" max="160" value="100" id="zoom" aria-label="Zoom"><button id="zoomIn" class="icon-btn" aria-label="Acercar">+</button><button class="quiet" id="fitZoom">100%</button><button id="fullscreen" class="quiet" title="Ampliar área de trabajo" aria-label="Ampliar área de trabajo"><span data-icon="expand"></span></button></div></div><div class="templates" id="templates"></div></footer><div class="statusbar"><span id="statusText">Página 1 de 6</span><span id="selectionText">Sin selección</span><span id="overflowStatus"></span><span class="status-spacer"></span><span>Unidades: mm</span><span class="saved" id="savedState"><i></i> Guardado en tu equipo</span></div></section>
 <aside class="inspector"><div class="tabs" role="tablist"><button class="tab active" data-tab="design" role="tab" aria-selected="true">Diseño</button><button class="tab" data-tab="text" role="tab" aria-selected="false">Texto</button><button class="tab" data-tab="pages" role="tab" aria-selected="false">Páginas</button><button class="tab" data-tab="index" role="tab" aria-selected="false">Índice</button></div><div id="inspectorContent" class="inspector-content"></div><div class="inspector-foot"><span data-icon="info"></span><span id="inspectorTip">La grilla es una guía: no se imprime ni aparece en el PDF.</span></div></aside>
</main>
<dialog id="modal"><form method="dialog" id="modalForm"><div class="modal-header"><div><h1 id="modalTitle"></h1></div><button value="cancel" class="icon-btn" aria-label="Cerrar"><span data-icon="close"></span></button></div><div id="modalBody"></div><div class="modal-actions"><button value="cancel" class="btn">Cancelar</button><button type="button" id="modalApply" class="btn primary">Aplicar</button></div></form></dialog>
<input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden><input type="file" id="openInput" accept=".mqt,.maquetario,.librostudio,.json" hidden><div class="language-source" hidden><select id="language" aria-label="Idioma" title="Idioma de la interfaz"><option value="es">ES · Español</option><option value="en">EN · English</option><option value="pt">PT · Português</option></select></div><div id="toast" role="status"></div><div id="printRoot"></div>
<script src="pdf-lib.min.js"></script><script src="sample-image.js"></script><script src="hyphenation/hyphen.js"></script><script src="hyphenation/patterns/es.js"></script><script src="hyphenation/patterns/en-us.js"></script><script src="hyphenation/patterns/pt.js"></script><script src="build/core.js"></script><script src="build/studio.js"></script><script src="build/app.js"></script><script src="test-loader.js"></script></body></html>
